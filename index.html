<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>FediEL-Chem 2026</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; display: flex; margin: 0; background: var(--bg); color: var(--text); }
        
        /* Sidebar */
        nav { width: 260px; height: 100vh; background: var(--panel); padding: 20px; position: fixed; box-shadow: 2px 0 5px rgba(0,0,0,0.3); }
        nav h2 { color: var(--accent); font-size: 1.2em; margin-bottom: 30px; }
        button.nav-btn { display: block; width: 100%; padding: 12px; margin-bottom: 8px; background: transparent; border: 1px solid #334155; color: white; cursor: pointer; text-align: left; border-radius: 5px; transition: 0.3s; }
        button.nav-btn:hover { background: var(--accent); color: var(--bg); }

        /* Main */
        main { margin-left: 300px; padding: 40px; width: 100%; }
        .lang-switch { position: absolute; top: 20px; right: 20px; }
        .section { display: none; }
        .active { display: block; }
        .card { background: var(--panel); padding: 20px; border-radius: 10px; border-left: 4px solid var(--accent); }
    </style>
</head>
<body>

<nav>
    <h2>FediEL-Chem 2026</h2>
    <div id="menu">
        <button class="nav-btn" onclick="show('chat')" data-en="AI Tutor" data-fr="Tuteur IA">AI Tutor</button>
        <button class="nav-btn" onclick="show('quiz')" data-en="Quiz Generator" data-fr="Générateur de Quiz">Quiz Generator</button>
        <button class="nav-btn" onclick="show('flash')" data-en="Flashcards" data-fr="Flashcards">Flashcards</button>
        <button class="nav-btn" onclick="show('notes')" data-en="Study Notes" data-fr="Notes d'Étude">Study Notes</button>
        <button class="nav-btn" onclick="show('mol')" data-en="Molecule Explorer" data-fr="Explorateur de Molécules">Molecule Explorer</button>
        <button class="nav-btn" onclick="show('react')" data-en="Reaction Explorer" data-fr="Explorateur de Réactions">Reaction Explorer</button>
        <button class="nav-btn" onclick="show('hw')" data-en="Homework Helper" data-fr="Aide aux Devoirs">Homework Helper</button>
        <button class="nav-btn" onclick="show('lab')" data-en="Lab Chemistry Tools" data-fr="Outils de Chimie de Labo">Lab Chemistry Tools</button>
    </div>
</nav>

<div class="lang-switch">
    <button onclick="setLang('en')">EN</button>
    <button onclick="setLang('fr')">FR</button>
</div>

<main>
    <h1 data-en="Welcome to your Chemistry Portal" data-fr="Bienvenue sur votre portail de chimie">Welcome to your Chemistry Portal</h1>
    
    <div id="chat" class="section active card">
        <h2 data-en="AI Tutor" data-fr="Tuteur IA">AI Tutor</h2>
        <p data-en="Ask your chemistry questions here." data-fr="Posez vos questions de chimie ici.">Ask your chemistry questions here.</p>
    </div>

    <!-- Répète ce modèle pour toutes les sections -->
    <div id="lab" class="section card">
        <h2 data-en="Lab Chemistry Tools" data-fr="Outils de Chimie de Labo">Lab Chemistry Tools</h2>
        <p data-en="Names and importance of lab equipment." data-fr="Noms et importance du matériel de laboratoire.">Names and importance of lab equipment.</p>
    </div>

    <footer style="margin-top:50px; font-size:0.8em; color:#64748b;">Founded by Fedisel Musaw © 2026</footer>
</main>

<script>
    function show(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function setLang(lang) {
        document.querySelectorAll('[data-en]').forEach(el => {
            el.innerText = el.getAttribute('data-' + lang);
        });
    }
</script>
</body>
</html>

<div id="mol" class="section card">
    <h2 data-en="Molecule Explorer" data-fr="Explorateur de Molécules">Molecule Explorer</h2>
    
    <input type="text" id="molInput" placeholder="ex: aspirine, glucose...">
    <button onclick="rechercherMolecule()" data-en="Search" data-fr="Rechercher">Search</button>
    
    <div id="molResult" style="margin-top:20px;">
        <p data-en="Results will appear here" data-fr="Les résultats apparaîtront ici">Results will appear here</p>
    </div>
</div>
