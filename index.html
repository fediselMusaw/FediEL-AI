<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>FediEL-AI | Health-Tech Platform</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #38bdf8; }
        body { font-family: 'Segoe UI', sans-serif; display: flex; margin: 0; background: var(--bg); color: var(--text); }
        
        /* Sidebar */
        nav { width: 250px; height: 100vh; background: var(--panel); padding: 20px; position: fixed; }
        nav h2 { color: var(--accent); font-size: 1.2em; }
        nav button { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background: none; border: 1px solid #334155; color: white; cursor: pointer; text-align: left; border-radius: 5px; }
        nav button:hover { background: var(--accent); }

        /* Main Content */
        main { margin-left: 290px; padding: 40px; width: 100%; }
        .disclaimer { background: #7f1d1d; padding: 10px; border-radius: 5px; font-size: 0.8em; margin-bottom: 20px; }
        .section { display: none; }
        .active { display: block; }
        textarea, input[type="file"] { width: 100%; background: var(--panel); border: 1px solid #334155; color: white; padding: 10px; margin-top: 10px; }
        
        /* Survey Styling */
        .q-card { background: var(--panel); padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--accent); }
    </style>
</head>
<body>

<nav>
    <h2>FediEL-AI 2026</h2>
    <button onclick="show('chat')">AI Chat Assistant</button>
    <button onclick="show('pharma')">Pharmacovigilance & PharmD</button>
    <button onclick="show('patient')">Patient Treatment Regimen</button>
    <button onclick="show('tools')">Study Tools</button>
    <button onclick="show('survey')">Health Survey</button>
</nav>

<main>
    <div class="disclaimer">Only for learning purposes. | À but éducatif uniquement.</div>

    <div id="chat" class="section active">
        <h2>AI Assistant (Pharmacology/Chem)</h2>
        <textarea id="aiInput" rows="5" placeholder="Posez votre question..."></textarea>
        <button onclick="alert('IA en attente de connexion')">Envoyer</button>
    </div>

    <div id="survey" class="section">
        <h2>Health Survey (10 questions)</h2>
        <form id="surveyForm"></form>
        <button onclick="saveSurvey()">Enregistrer & Calculer le score</button>
        <div id="surveyResult"></div>
    </div>

    <div id="tools" class="section">
        <h2>Study Tools</h2>
        <input type="file" id="docUpload">
        <button onclick="alert('Traitement du document...')">Upload & Process Summary</button>
    </div>
</main>

<footer style="position:fixed; bottom:10px; right:20px; font-size:0.7em;">Founded by Fedisel Musaw © 2026</footer>

<script>
    // Logic pour changer de section
    function show(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // Survey Logic
    const questions = [
        "Privilégiez-vous les produits locaux ?", "Consommez-vous bio ?", 
        "Évitez-vous les ultra-transformés ?", "Vérifiez-vous les additifs ?",
        "Limitez-vous le plastique ?", "Contrôlez-vous les pesticides ?",
        "Utilisez-vous du verre ?", "Sensibilisé au radon ?",
        "Protection UV quotidienne ?", "Partagez-vous les conseils ?"
    ];

    const form = document.getElementById('surveyForm');
    questions.forEach((q, i) => {
        form.innerHTML += `<div class="q-card">${i+1}. ${q}<br>
            <input type="radio" name="q${i}" value="1"> Oui/Yes 
            <input type="radio" name="q${i}" value="0"> Non/No</div>`;
    });

    function saveSurvey() {
        let score = 0;
        for(let i=0; i<10; i++) {
            let val = document.querySelector(`input[name="q${i}"]:checked`);
            if(val) score += parseInt(val.value);
        }
        localStorage.setItem('userScore', score);
        document.getElementById('surveyResult').innerHTML = "<h3>Score : " + score + "/10</h3><p>Sauvegardé localement.</p>";
    }
</script>

    
</body>
</html>
<!-- Bouton de changement de langue -->
<div style="position: absolute; top: 10px; right: 20px;">
    <button onclick="setLanguage('fr')">FR</button>
    <button onclick="setLanguage('en')">EN</button>
</div>
